[package]
name = "net-adaptive-test"
version = "0.1.0"
edition = "2021"
description = "网卡自适应测速 · 链路协商 100M/10M/1000M · 丢包 · 延迟 · MTU · 判定 (Rust 端口)"

[dependencies]
ctrlc = "3.4"          # 唯一依赖: 纯 Rust, 用于 Ctrl+C/TERM 时恢复网卡自动协商

[profile.release]
opt-level = "z"        # 体积优先, 适合嵌入式 ARM 设备
lto = true
codegen-units = 1
strip = true
panic = "abort"
